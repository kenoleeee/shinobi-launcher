name: Bug report
description: Something doesn't work in Shinobi Launcher
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Shinobi Launcher → About Shinobi Launcher
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.5, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Game server
      placeholder: "S2852"
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Help → Open Debug Log, then paste the last ~50 lines. Passwords are never logged.
      render: text
